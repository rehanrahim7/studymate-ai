[project]
name = "studymate-api"
version = "0.1.0"
description = "StudyMate AI backend — RAG-powered study assistant for academic PDFs."
readme = { text = "FastAPI backend for StudyMate AI. See the repository README for setup instructions.", content-type = "text/markdown" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "pymupdf>=1.24.10",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
# Heavy ML dependencies (torch, sentence-transformers, faiss).
# Installed on demand with: pip install -e ".[rag]"
rag = [
    "numpy>=1.26",
    "sentence-transformers>=3.2.1",
    "faiss-cpu>=1.9.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*", "fitz.*", "pymupdf.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false
